<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#55F000"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Aasgard Training"><link rel="manifest" href="manifest.webmanifest?v=1.2.0"><link rel="icon" href="icon.svg?v=1.2.0"><link rel="apple-touch-icon" href="icon.svg?v=1.2.0"><link rel="stylesheet" href="style.css?v=1.2.0"><title>Aasgard Training</title></head><body><main class="app"><section id="today" class="screen active"><header class="top"><div class="brand"><img src="icon.svg?v=1.2.0"><div><h1>Aasgard Training</h1><div id="date" class="sub"></div></div></div><span class="pill">On demand</span></header><div class="hero"></div><div class="card accent"><div class="row"><div><h2 id="title"></h2><div id="duration" class="sub"></div></div><span id="code" class="tag"></span></div><div id="exercises"></div></div><div class="card"><div class="row"><div><div class="sub">Progresso deste treino</div><div class="big"><span id="done">0</span>/<span id="total">0</span></div></div><div id="pct" class="big">0%</div></div><div class="progress"><span id="bar"></span></div></div><button id="complete" class="btn primary">Concluir e passar ao próximo</button><div class="gap"></div><button id="skip" class="btn secondary">Saltar este treino</button><footer class="footer"></footer></section><section id="sequence" class="screen"><header class="top"><div><h1>Sequência</h1><div class="sub">Sem dias fixos. Treinas quando quiseres.</div></div><span id="blockpill" class="pill"></span></header><div id="blocks"></div><footer class="footer"></footer></section><section id="progress" class="screen"><header class="top"><div><h1>Progresso</h1><div class="sub">Consistência &gt; perfeição</div></div><span id="levelpill" class="pill"></span></header><div class="grid"><div class="metric"><span class="sub">Taxa de conclusão</span><b id="rate">100%</b></div><div class="metric"><span class="sub">Treinos feitos</span><b id="count">0</b></div><div class="metric"><span class="sub">Este mês</span><b id="month">0</b></div><div class="metric"><span class="sub">Nível</span><b id="level">Recruta</b></div></div><footer class="footer"></footer></section><section id="milestones" class="screen"><header class="top"><div><h1>Milestones</h1><div class="sub">Bloco e mês</div></div><span class="pill">Aasgard mode</span></header><div class="card"><h2>Bloco atual</h2><div id="ms"></div></div><h2>Mês</h2><div class="month" id="monthly"></div><footer class="footer"></footer></section></main><nav class="tabs"><button class="tab active" data-s="today">Hoje</button><button class="tab" data-s="sequence">Sequência</button><button class="tab" data-s="progress">Progresso</button><button class="tab" data-s="milestones">Milestones</button></nav><div id="exerciseModal" class="modal" aria-hidden="true"><div class="modalSheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modalTop"><div><div class="sub">Guia do exercício</div><h2 id="modalTitle"></h2></div><button id="modalClose" class="closeBtn" aria-label="Fechar">×</button></div><div id="modalVisual" class="visual"></div><div id="modalReps" class="tag"></div><p id="modalTip" class="tip"></p><div class="cue"><b>Execução</b><div id="modalSteps"></div></div></div></div><script src="app.js?v=1.2.0"></script></body></html>
