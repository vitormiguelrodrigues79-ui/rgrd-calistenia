<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#55f000"><meta name="apple-mobile-web-app-capable" content="yes"><title>RGRD</title><style>:root{--g:#55f000;--y:#ffe600;--bg:#f5f6f5;--c:#fff;--t:#111315;--m:#747a76;--l:#e5e8e5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;padding:max(18px,env(safe-area-inset-top)) 14px calc(92px + env(safe-area-inset-bottom))}.app{max-width:720px;margin:auto}h1{font-size:32px;margin:0;letter-spacing:-.04em}h2{font-size:19px;margin:0 0 10px}.sub{font-size:13px;color:var(--m);margin-top:4px}.top,.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.top{margin:8px 2px 18px}.pill,.tag{padding:7px 10px;border-radius:999px;background:#ecffe7;color:#178500;font-size:12px;font-weight:800}.hero{height:4px;border-radius:9px;background:linear-gradient(90deg,var(--g),var(--y));margin:8px 0 18px}.card{background:var(--c);border:1px solid var(--l);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 10px 30px rgba(0,0,0,.04)}.accent{border-left:5px solid var(--g)}.ex{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #eef0ee}.ex:last-child{border:0}.check{width:27px;height:27px;border:2px solid #c7ccc8;border-radius:50%;background:#fff}.check.done{background:var(--g);border-color:var(--g)}.check.done:after{content:'✓';font-weight:900}.name{font-weight:800}.meta{font-size:13px;color:var(--m)}.btn{width:100%;min-height:52px;border:0;border-radius:16px;font-weight:850;margin-bottom:10px}.primary{background:var(--g)}.secondary{background:#ecefec}.progress{height:9px;background:#edf0ed;border-radius:999px;overflow:hidden}.progress span{display:block;height:100%;background:var(--g)}.big{font-size:32px;font-weight:900}.weekitem{display:grid;grid-template-columns:55px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #eef0ee}.day{background:var(--g);padding:8px;border-radius:10px;text-align:center;font-size:12px;font-weight:900}.alt{background:var(--y)!important;color:#222}.ms{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;padding:10px 0}.ico{width:40px;height:40px;border-radius:14px;background:#efffec;display:grid;place-items:center;font-weight:900}.grid,.month{display:grid;grid-template-columns:1fr 1fr;gap:11px}.metric,.mcard{background:#fff;border:1px solid var(--l);border-radius:18px;padding:15px}.metric b{font-size:25px;display:block;margin-top:5px}.mcard{text-align:center}.shield{width:58px;height:58px;border-radius:18px;background:#efffea;display:grid;place-items:center;margin:0 auto 9px;font-size:20px;font-weight:900}.screen{display:none}.screen.active{display:block}.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(18px);border-top:1px solid var(--l);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:5}.tab{min-height:54px;border:0;background:transparent;border-radius:14px;color:#707571;font-weight:800;font-size:12px}.tab.active{background:#f2ffef;color:#168c00}.notice{text-align:center;color:var(--m);font-size:12px;padding:7px}</style></head><body><main class="app"><section id="today" class="screen active"><div class="top"><div><h1>Hoje</h1><div id="date" class="sub"></div></div><span id="cycle" class="pill"></span></div><div class="hero"></div><div class="card accent"><div class="row"><div><h2 id="title"></h2><div id="duration" class="sub"></div></div><span id="code" class="tag"></span></div><div id="exercises"></div></div><div class="card"><div class="row"><div><div class="sub" id="progressLabel">Progresso</div><div class="big"><span id="done">0</span>/<span id="total">0</span></div></div><div id="pct" class="big">0%</div></div><div class="progress"><span id="bar" style="width:0%"></span></div></div><button id="complete" class="btn primary">Marcar treino como feito</button><button id="miss" class="btn secondary">Não fui hoje</button><div class="notice">🔒 Dados guardados neste dispositivo</div></section><section id="week" class="screen"><div class="top"><div><h1>Semana</h1><div class="sub">Todos os treinos da semana</div></div><span id="wlabel" class="pill"></span></div><div id="weekcards"></div><div class="card"><h2>Milestones da semana</h2><div id="weekly"></div></div></section><section id="progress" class="screen"><div class="top"><div><h1>Progresso</h1><div class="sub">Consistência &gt; perfeição</div></div><span id="levelpill" class="pill"></span></div><div class="grid"><div class="metric"><span class="sub">Cumprimento</span><b id="rate">0%</b></div><div class="metric"><span class="sub">Treinos</span><b id="allcount">0</b></div><div class="metric"><span class="sub">Este mês</span><b id="monthcount">0</b></div><div class="metric"><span class="sub">Nível</span><b id="level">Recruta</b></div></div></section><section id="milestones" class="screen"><div class="top"><div><h1>Milestones</h1><div class="sub">Semana e mês</div></div><span class="pill">Disciplina</span></div><div class="card"><h2>Semana</h2><div id="msweek"></div></div><h2>Mês</h2><div id="msmonth" class="month"></div><div class="notice">Disciplina &gt; motivação.</div></section></main><nav class="tabs"><button class="tab active" data-s="today">Hoje</button><button class="tab" data-s="week">Semana</button><button class="tab" data-s="progress">Progresso</button><button class="tab" data-s="milestones">Milestones</button></nav><script>const K='rgrd_v2',START=new Date('2026-09-01T12:00:00'),DAYS=['SEG','QUA','SEX'],map={1:0,3:1,5:2};const P=[[['A1','Treino A','Força + Core',32,[['Flexões','3×12'],['Australian Pull-ups','3×8'],['Bulgarian Split Squat','3×10/perna'],['Hollow Hold','3×30s'],['Burpees','3×8']]],['B1','Treino B','Pull + Core',30,[['Pike Push-ups','3×8'],['Pull-up negativa','4×4'],['Walking Lunges','3×12/perna'],['Dead Bug','3×10/lado'],['Mountain Climbers','4×30s']]],['C1','Treino C','Lower + Cond.',34,[['Diamond Push-ups','3×8'],['Australian Pull-ups','4×8'],['Agachamento','4×15'],['Leg Raises','3×10'],['Burpees','5×6']]]],[['A2','Treino A2','Força + Core',33,[['Flexões declinadas','3×10'],['Remada invertida','3×10'],['Bulgarian Split Squat','4×8/perna'],['Prancha lateral','3×30s/lado'],['Bear Crawl','4×20m']]],['B2','Treino B2','Upper + Pull',31,[['Pike Push-ups','4×7'],['Chin-up negativa','4×4'],['Reverse Lunges','3×12/perna'],['Hollow Rocks','3×12'],['High Knees','5×30s']]],['C2','Treino C2','Lower + Cond.',35,[['Flexões pausadas','3×10'],['Australian Pull-ups pés altos','3×8'],['Jump Squats','4×10'],['Leg Raises','3×12'],['Burpees','4×10']]]],[['A3','Treino A3','Volume + Core',35,[['Flexões','4×12'],['Australian Pull-ups','4×10'],['Split Squat','3×14/perna'],['Hollow Hold','4×30s'],['Burpees','4×8']]],['B3','Treino B3','Pull + Ombros',32,[['Pike Push-ups','4×9'],['Pull-up assistida','5×4'],['Step-ups','3×12/perna'],['Plank Shoulder Tap','3×20'],['Mountain Climbers','5×30s']]],['C3','Treino C3','Potência + Cond.',34,[['Explosive Push-ups','4×6'],['Remada invertida','4×10'],['Jump Lunges','3×10/perna'],['Knee Raises','4×10'],['Shuttle Burpees','5×6']]]],[['A4','Treino A4','Teste + Core',30,[['Flexões','1×máx + 2×70%'],['Australian Pull-ups','1×máx + 2×70%'],['Bulgarian Split Squat','3×10/perna'],['Prancha','1×máx + 2×45s'],['Burpees','3×10']]],['B4','Treino B4','Técnica + Pull',28,[['Pike Push-ups','3×8'],['Pull-up negativa lenta','5×3'],['Reverse Lunges','3×10/perna'],['Dead Bug','3×12/lado'],['Bear Crawl','3×20m']]],['C4','Treino C4','Challenge',36,[['Flexões','50 total'],['Australian Pull-ups','30 total'],['Agachamentos','80 total'],['Leg Raises','30 total'],['Burpees','30 total']]]]];let st;try{st=JSON.parse(localStorage.getItem(K))||{logs:{},checks:{}}}catch(e){st={logs:{},checks:{}}}const save=()=>localStorage.setItem(K,JSON.stringify(st)),iso=d=>{let y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),x=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${x}`},cycleFor=d=>((Math.floor((d-START)/604800000)%4)+4)%4,todayCycle=()=>cycleFor(new Date()),todayIndex=()=>map[new Date().getDay()];function todays(){let i=todayIndex();return i===undefined?null:P[todayCycle()][i]}function nextWorkout(){let n=new Date();for(let a=1;a<=7;a++){let d=new Date(n);d.setDate(n.getDate()+a);let i=map[d.getDay()];if(i!==undefined)return{date:d,w:P[cycleFor(d)][i]}}}function addExercises(w,key,interactive=true){exercises.innerHTML='';st.checks[key]??={};w[4].forEach((e,i)=>{let r=document.createElement('div');r.className='ex';let b=document.createElement('button');b.className='check'+(st.checks[key][i]?' done':'');b.disabled=!interactive;b.onclick=()=>{st.checks[key][i]=!st.checks[key][i];save();renderToday()};r.append(b);let t=document.createElement('div');t.innerHTML='<div class=name>'+e[0]+'</div><div class=meta>'+e[1]+'</div>';r.append(t);exercises.append(r)})}function renderToday(){let n=new Date(),w=todays(),key=iso(n);date.textContent=n.toLocaleDateString('pt-PT',{weekday:'long',day:'numeric',month:'long'});cycle.textContent='Semana '+(todayCycle()+1);if(w){title.textContent=w[1]+' · '+w[2];duration.textContent='~'+w[3]+' min';code.textContent=w[0];addExercises(w,key,true);let c=Object.values(st.checks[key]||{}).filter(Boolean).length,p=Math.round(c/w[4].length*100);done.textContent=c;total.textContent=w[4].length;pct.textContent=p+'%';bar.style.width=p+'%';progressLabel.textContent='Progresso de hoje';complete.disabled=miss.disabled=false;complete.textContent='Marcar treino como feito';return}let nx=nextWorkout();title.textContent='Hoje · Recuperação';duration.textContent='Descanso ou 10–15 min de mobilidade';code.textContent='OFF';let w2=nx.w,k2=iso(nx.date);addExercises(w2,k2,false);let when=nx.date.toLocaleDateString('pt-PT',{weekday:'long',day:'numeric',month:'short'});exercises.insertAdjacentHTML('afterbegin','<div style="padding:8px 0 10px"><div class=sub style="text-transform:uppercase;font-weight:800;color:#111">Próximo treino · '+when+'</div><div style="font-size:18px;font-weight:900;margin-top:5px">'+w2[1]+' · '+w2[2]+'</div></div>');done.textContent=0;total.textContent=w2[4].length;pct.textContent='Próximo';bar.style.width='0%';progressLabel.textContent='Plano seguinte';complete.disabled=miss.disabled=true;complete.textContent='Hoje é dia de recuperação'}function weekStart(){let d=new Date(),x=(d.getDay()+6)%7;d.setDate(d.getDate()-x);d.setHours(12,0,0,0);return d}function weekDone(){let m=weekStart(),c=0;[0,2,4].forEach(o=>{let d=new Date(m);d.setDate(m.getDate()+o);if(st.logs[iso(d)]==='done')c++});return c}function renderWeek(){let cur=todayCycle();wlabel.textContent='Semana '+(cur+1)+' de 4';weekcards.innerHTML='';[cur,(cur+1)%4].forEach((n,z)=>{let c=document.createElement('div');c.className='card';c.innerHTML='<div class=row><h2>Semana '+(n+1)+'</h2><span class="tag '+(z?'alt':'')+'">'+(z?'Próxima':'Atual')+'</span></div>'+P[n].map((w,i)=>'<div class=weekitem><div class="day '+(z?'alt':'')+'">'+DAYS[i]+'</div><div><b>'+w[1]+'</b><div class=sub>'+w[2]+' · ~'+w[3]+' min</div><div class=sub>'+w[4].map(e=>e[0]+' '+e[1]).join(' · ')+'</div></div><span class=tag>'+w[0]+'</span></div>').join('');weekcards.append(c)});let c=weekDone();weekly.innerHTML=[['✓','Completar 3/3 treinos',c,3],['↗','Atingir 2 treinos na semana',Math.min(c,2),2],['↻','Não falhar treino programado',c,3]].map(x=>'<div class=ms><div class=ico>'+x[0]+'</div><div><b>'+x[1]+'</b><div class=progress style="margin-top:7px"><span style="width:'+Math.min(100,x[2]/x[3]*100)+'%"></span></div></div><b>'+x[2]+'/'+x[3]+'</b></div>').join('')}function stats(){let e=Object.entries(st.logs),d=e.filter(x=>x[1]=='done').length,m=e.filter(x=>x[1]=='miss').length,r=d+m?Math.round(d/(d+m)*100):0,mo=iso(new Date()).slice(0,7),mc=e.filter(x=>x[0].startsWith(mo)&&x[1]=='done').length,l=d>=36?'Elite':d>=20?'Avançado':d>=8?'Operacional':'Recruta';return{d,m,r,mc,l}}function renderStats(){let s=stats();rate.textContent=s.r+'%';allcount.textContent=s.d;monthcount.textContent=s.mc;level.textContent=levelpill.textContent=s.l;let c=weekDone();msweek.innerHTML=[['✓','Completar 3 treinos',c,3],['↗','2 treinos sem falhar',Math.min(c,2),2]].map(x=>'<div class=ms><div class=ico>'+x[0]+'</div><div><b>'+x[1]+'</b></div><b>'+x[2]+'/'+x[3]+'</b></div>').join('');msmonth.innerHTML=[['10','10 treinos no mês',Math.min(100,s.mc/10*100)],['80%','80% consistência',Math.min(100,s.r/80*100)]].map(x=>'<div class=mcard><div class=shield>'+x[0]+'</div><b>'+x[1]+'</b><div class=progress style="margin-top:10px"><span style="width:'+x[2]+'%"></span></div></div>').join('')}function refresh(){renderToday();renderWeek();renderStats()}complete.onclick=()=>{let w=todays();if(!w)return;let k=iso(new Date());st.checks[k]??={};w[4].forEach((_,i)=>st.checks[k][i]=true);st.logs[k]='done';save();refresh()};miss.onclick=()=>{if(!todays())return;st.logs[iso(new Date())]='miss';save();refresh()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.screen').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.s).classList.add('active')});refresh();</script></body></html>
