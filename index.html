<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#55f000"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="RGRD"><link rel="manifest" href="manifest.webmanifest"><title>RGRD</title><style>body{margin:0;background:#f5f6f5;color:#111315;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}.box{text-align:center;padding:28px}.dot{width:54px;height:54px;border-radius:18px;background:#55f000;margin:0 auto 14px;display:grid;place-items:center;font-weight:900;font-size:24px}</style></head><body><div class="box"><div class="dot">R</div><strong>A abrir RGRD…</strong></div><script>(async()=>{try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()));}if('caches'in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));}}catch(e){}location.replace('./app-v2.html?v=4');})();</script></body></html>
